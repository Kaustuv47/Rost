[workspace]
members = ["hello-world", "init", "net", "shell", "uart-drv", "vfs"]
resolver = "2"

# Servers are standalone ring-3 ELF binaries.
# Build command:  cargo build --target x86_64-unknown-none
# (each server has its own .cargo/config.toml to set the default target)

[profile.dev]
opt-level = 0
panic     = "abort"

[profile.release]
opt-level      = 3
lto            = true
codegen-units  = 1
strip          = true
panic          = "abort"
