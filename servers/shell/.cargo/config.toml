[build]
# Freestanding x86_64 — no OS ABI, no libc, no std.
# When the Rost ELF loader is ready it maps this binary into a ring-3
# address space and jumps to _start.
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
rustflags = [
    "-C", "link-arg=-nostdlib",
    "-C", "no-redzone",          # no red-zone — safe for signal/interrupt frames
]
