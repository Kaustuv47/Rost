[package]
name = "kernel"
version = "0.1.0"
edition = "2021"
description = "Rost microkernel — UEFI entry point and shell"

[[bin]]
name = "Rost"
path = "src/main.rs"

[features]
# Enable SIL-4 production-mode safety checks that halt the system when
# firmware security requirements are not met (e.g. Secure Boot disabled).
# Omitted in development / QEMU builds where the checks produce warnings only.
safety-mode = []

# Enable SYS_INJECT_FAULT (syscall 25) for exception-handler path verification.
# NEVER enable in production: this syscall lets any ring-3 process trigger a
# CPU exception from within the kernel, which may halt the system.
fault-injection = ["arch-x86_64/fault-injection"]

[dependencies]
uefi = { version = "0.26", default-features = false, features = ["alloc"] }
arch-x86_64 = { path = "../arch-x86_64" }
hal = { path = "../hal" }
core-kernel = { path = "../core-kernel" }
